/* Product UI refinement: consistent controls, hierarchy, and focus states */
:root{--ui-border:#dfe3e8;--ui-muted:#737b87}
.vtab{border-radius:7px;transition:background .14s ease,color .14s ease}
.vtab:hover{background:var(--sf2)}
.vtab.on{font-weight:600}
.lk,.nv button,.nv select,.nv input{transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease}
.nv thead th{font-weight:600;letter-spacing:.01em;color:var(--ui-muted)}
.nv td{vertical-align:middle}
.nv .lc{cursor:pointer}
.nv .lc:hover .pill{box-shadow:inset 0 0 0 1px #00000018;filter:brightness(.98)}
.nv .pill{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:5px;white-space:nowrap}
.nv button:focus-visible,.nv select:focus-visible,.lk:focus-visible,.vtab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nv select{max-width:100%;border:1px solid var(--ui-border);border-radius:6px;padding:6px 9px;background:var(--sf);color:var(--tx);font:inherit}
.nv select:hover{border-color:#b8c0cb}
@media(max-width:650px){.nv{font-size:13px}.nv td,.nv th{padding:8px 7px}.vtab{padding-inline:10px}}

.calgrid.calweek .calday{height:auto;min-height:120px;align-self:stretch;overflow:visible}
.calgrid.calweek .calevent{white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.4;padding:6px 7px;margin:4px 0}

.tb{gap:6px}

.tb button.act{background:#e8f3ff;border-color:#b8d9ff;color:#005fc5}

.vt{border-bottom:1px solid var(--line);gap:8px;margin-bottom:10px}

function vGuide(){return `<div class="box guide-view"><span class="table-eyebrow">AFFINITY NEO · USER GUIDE</span><h2>업무 관리 설명서</h2><p class="guide-intro">각 보기와 항목이 어떤 역할을 하는지 정리했습니다. 사용 방법이 헷갈릴 때 이 페이지를 먼저 확인해 주세요.</p><section><h3>보기별 기능</h3><div class="guide-grid"><article><b>오늘 확인</b><p>오늘 처리할 업무, 마감 지연, 이번 주 계획, 위임·대기 업무를 확인합니다. 제목에 📌가 있는 상위 업무는 이 화면에서 제외됩니다.</p></article><article><b>메인 테이블</b><p>전체 업무를 등록하고 상태·담당자·분류·처리 방식·예정일·마감일·예상 시간을 관리합니다. 홀딩·비수익·개인 분류는 보관함으로 분리됩니다.</p></article><article><b>캘린더</b><p>예정은 내가 끝내려는 목표일, 마감은 외부에서 정한 실제 마감일입니다. 예정·마감·전체를 전환해 확인할 수 있습니다.</p></article><article><b>시간 설정</b><p>수업·과제·외부 미팅을 업무로 만들지 않고 등록합니다. 매주 반복 또는 특정 날짜 일정을 설정하면 해당 날짜의 가용 업무 시간에서 차감됩니다.</p></article><article><b>완료 보드</b><p>완료 처리한 업무를 완료일 기준으로 모아 봅니다. 필요하면 진행 중으로 되돌릴 수 있습니다.</p></article><article><b>비서 점검표</b><p>매일 또는 정해진 주기로 확인할 운영 업무를 체크합니다.</p></article></div></section><section><h3>업무 항목의 의미</h3><dl><dt>예정 완료일</dt><dd>내가 해당 업무를 끝내기로 계획한 날짜입니다. 캘린더의 ‘예정’에 표시됩니다.</dd><dt>실제 마감일</dt><dd>회사·고객·담당자 등 외부에서 정한 최종 기한입니다. 캘린더의 ‘마감’에 표시됩니다.</dd><dt>예상 시간</dt><dd>업무에 실제로 투입할 것으로 예상하는 시간(분)입니다. 오늘 예정 업무의 시간 합계에 반영됩니다.</dd><dt>처리 방식</dt><dd>긴 작업·빠른 작업·위임·대기 중 하나를 선택합니다. 업무의 진행 방식을 구분하는 항목입니다.</dd><dt>업무 분류</dt><dd>핵심·운영은 메인 목록, 홀딩·비수익·개인은 보관함, 미분류는 아직 분류하지 않은 업무입니다.</dd><dt>📌 고정 업무</dt><dd>상위 업무 제목에 📌를 붙이면 오늘 확인·계획 목록에서 제외됩니다. 메인 테이블에는 그대로 남습니다. 하위 아이템의 📌는 고정 표시로 처리하지 않습니다.</dd></dl></section><section><h3>업무 시간 계산</h3><p>기본 근무 시간은 09:00~18:00이며 휴식 1시간을 제외해 480분으로 계산합니다. ‘시간 설정’에 등록한 수업·과제·외부 미팅을 빼고, 오늘 예정된 업무의 예상 시간을 차감해 남은 시간을 보여줍니다. 예상 시간이 비어 있는 업무는 합계에 포함되지 않으므로 실제 여유 시간은 임시값일 수 있습니다.</p></section><section><h3>데이터와 백업</h3><p>업무 데이터는 기존 저장 구조를 유지하며, 상단의 백업 버튼으로 JSON 파일을 내려받을 수 있습니다. 기기 간 데이터는 동기화 기능을 사용합니다.</p></section></div>`}

const ckey=k=>crypto.subtle.importKey('raw',unb64(k),'AES-GCM',false,['encrypt','decrypt']);
